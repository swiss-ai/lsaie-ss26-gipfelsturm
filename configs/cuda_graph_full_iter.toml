# CUDA graph variant: impl=full_iteration
# From "Tests to be Run" 8B sheet, TRAINING_ARGS section.
# Most aggressive: captures the whole iteration. Highest potential win but
# most likely to fail capture if anything in the step varies (dynamic shapes,
# python-side work, etc.) — expect this to be the most fragile of the four.
#
# Regenerate the launcher with:
#   ./generate_launch.py configs/cuda_graph_full_iter.toml
#
# Rules:
# - `true` adds a boolean flag or keeps an existing one.
# - `false` removes an existing flag from `launch.template.sh`.
# - strings / numbers emit `--flag value`.
# - arrays emit `--flag value1 value2 ...`.

[TRANSFORMER_ENGINE_ARGS]
# FP8 / Transformer Engine
# "--fp8-format" = "hybrid"
# "--fp8-amax-compute-algo" = "max"
# "--fp8-amax-history-len" = 16
# "--first-last-layers-bf16" = true
# "--num-layers-at-start-in-bf16" = 1
# "--num-layers-at-end-in-bf16" = 1
# "--apply-rope-fusion" = true
# "--bias-activation-fusion" = true
# "--masked-softmax-fusion" = true
# "--bias-dropout-fusion" = true
# "--fused-residual-rmsnorm" = true
# "--use-transformer-engine-op-fuser" = true
# "--attention-backend" = "flash"

[MIXED_PRECISION_ARGS]
# "--fp8-format" = "hybrid"
# "--fp8-amax-compute-algo" = "max"
# "--fp8-amax-history-len" = 16
# "--disable-bf16-reduced-precision-matmul" = true
# "--attention-softmax-in-fp32" = true

[NETWORK_SIZE_ARGS]
